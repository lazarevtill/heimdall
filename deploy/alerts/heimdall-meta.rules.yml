# Heimdall meta-rules: the alerts that watch the watcher. Until these are
# applied to Prometheus via the IaC alerts path, a crashed detector is NOT
# alertable — deploying this file is part of the detector slice, not
# optional polish.
groups:
  - name: heimdall-meta
    rules:
      - alert: HeimdallDetectorStale
        expr: time() - heimdall_last_run_timestamp_seconds{plane="tier1"} > 900
        labels:
          severity: critical
          source: heimdall-meta
        annotations:
          summary: "Heimdall detector has not completed a run in 15m"
          description: "The heartbeat gauge stopped advancing: the detector is crashing, hanging, or failing before its atomic .prom write (which deliberately withholds the heartbeat on failure)."
      - alert: HeimdallDetectorAbsent
        expr: absent(heimdall_last_run_timestamp_seconds{plane="tier1"})
        labels:
          severity: critical
          source: heimdall-meta
        annotations:
          summary: "Heimdall heartbeat series is absent"
          description: "Bootstrap gap, deleted textfile, or node_exporter rejected the .prom file (e.g. stray line timestamp). Absence is never treated as ok."
      - alert: HeimdallRedactionFailure
        expr: heimdall_redaction_failures_total > 0
        labels:
          severity: critical
          source: heimdall-meta
        annotations:
          summary: "Heimdall redaction failed during the last run"
          description: "Evidence was withheld (content-fail-closed). A broken redactor must page — it can never silently withhold forever."
      # ── Notifier liveness ────────────────────────────────────────────
      # The notifier is a daemon, so its heartbeat is written once per
      # cycle. Without these two rules a crashed notifier is silent: the
      # bridge keeps filling notify_outbox and nothing ever drains it.
      - alert: HeimdallNotifierStale
        expr: time() - heimdall_notifier_last_success_timestamp_seconds > 900
        labels:
          severity: critical
          source: heimdall-meta
        annotations:
          summary: "Heimdall notifier has not completed a cycle in 15m"
          description: "The notifier writes its heartbeat only after a successful cycle, so a crash, a wedged loop, an outbox store fault, or a failing heartbeat write all present as this gauge failing to advance. Alerts are still being detected and enqueued — they are simply not being delivered. (A failing Telegram poll does NOT stop the cycle; that is HeimdallNotifierPollStale.)"
      - alert: HeimdallNotifierAbsent
        expr: absent(heimdall_notifier_last_success_timestamp_seconds)
        labels:
          severity: critical
          source: heimdall-meta
        annotations:
          summary: "Heimdall notifier heartbeat series is absent"
          description: "Bootstrap gap, deleted textfile, or the notifier has never completed a cycle. Absence is never treated as ok."
      # A failed Telegram getUpdates poll no longer skips the cycle — drain,
      # silence reconcile and the heartbeat keep running, so the other sinks
      # still deliver during a Telegram outage. The price is that a dead
      # poller no longer stalls the heartbeat above, so it gets its own
      # rule. It warns rather than pages: delivery continues (the backlog
      # rules cover the Telegram sink itself), but button presses — acks,
      # mutes — are not being received. 0 means no successful poll since the
      # notifier started, which the `for` rides out on a normal start.
      - alert: HeimdallNotifierPollStale
        expr: time() - heimdall_notifier_last_poll_success_timestamp_seconds > 900
        for: 5m
        labels:
          severity: warning
          source: heimdall-meta
        annotations:
          summary: "Heimdall notifier has not polled Telegram successfully in 15m"
          description: "getUpdates keeps failing: Telegram is unreachable, the bot token was revoked, or another consumer holds the bot (HTTP 409: a webhook is set, or a second notifier is running). Deliveries continue, but inline-button presses are not being received. The notifier log names the error, with the token shown as [REDACTED:telegram-token]."

      # ── Per-sink delivery backlog ────────────────────────────────────
      # WHY THIS IS SEPARATE FROM THE HEARTBEAT ABOVE. A send failure is
      # deliberately non-fatal: the entry stays pending and the cycle still
      # succeeds, so the notifier heartbeat keeps advancing while a
      # destination is dead. That is correct for liveness and useless for
      # delivery — before this rule existed, Telegram could refuse every
      # message for a day with every heartbeat green. With several sinks the
      # blind spot multiplies, because one healthy sink masks the others.
      #
      # Routing through Alertmanager to possibly the very sink that is down
      # is not a flaw in this rule: with two or more sinks, the surviving
      # ones carry the page. That is the point of the fanout.
      - alert: HeimdallSinkBacklogCritical
        expr: heimdall_notifier_sink_oldest_pending_seconds{channel="main"} > 900
        for: 5m
        labels:
          severity: critical
          source: heimdall-meta
        annotations:
          summary: "Heimdall sink {{ $labels.sink }} has not delivered a main-channel alert in 15m"
          description: "The oldest undelivered entry for this sink is {{ $value | humanizeDuration }} old. Operator-facing alerts are being detected and enqueued but not delivered by this destination. Other sinks on the channel may still be working — check heimdall_notifier_sink_failed_total{sink=\"{{ $labels.sink }}\"} and the notifier log."
      - alert: HeimdallSinkBacklogWarning
        expr: heimdall_notifier_sink_oldest_pending_seconds{channel="analyst"} > 3600
        for: 15m
        labels:
          severity: warning
          source: heimdall-meta
        annotations:
          summary: "Heimdall sink {{ $labels.sink }} has not delivered a hypothesis in 1h"
          description: "The Tier-3 analyst channel is low-urgency by construction (G1: a hypothesis can never page), so a stuck hypothesis card warns rather than pages. It still means the analyst's output is not reaching anyone."
      - alert: HeimdallSinkBacklogAbsent
        expr: absent(heimdall_notifier_sink_oldest_pending_seconds)
        labels:
          severity: warning
          source: heimdall-meta
        annotations:
          summary: "Heimdall per-sink backlog series is absent"
          description: "The notifier renders one sample per routed (sink, channel) pair on every cycle, including zeroes, precisely so this series always exists. Its absence means the notifier is not writing its heartbeat file at all — cross-check HeimdallNotifierAbsent."

      # ── Bridge reachability ──────────────────────────────────────────
      # heimdall-bridge renders no heartbeat of its own, yet it is the ONLY
      # path from Alertmanager to every sink: a dead bridge loses every page
      # while the notifier's heartbeat stays green (it drains an empty
      # outbox, so its backlog reads 0). Watch it from the sending side
      # instead — Alertmanager counts every webhook delivery that failed.
      #
      # ROUTING: this alert MUST go to an Alertmanager receiver that does
      # NOT go through the bridge (a native telegram/email/pushover
      # receiver). Routed like every other alert, it would be handed to the
      # very component it reports dead, and nobody would ever see it.
      #
      # Scope: integration="webhook" counts every webhook receiver this
      # Alertmanager has; if the bridge is not the only one, narrow it with
      # the receiver label where your Alertmanager exposes it. It fires only
      # while something is being sent (a dead bridge with nothing to carry
      # has lost nothing yet), and only if this Prometheus scrapes
      # Alertmanager's own metrics. The `for` rides out a bridge restart:
      # Alertmanager retries, and a retry that lands lost nothing.
      - alert: HeimdallBridgeUnreachable
        expr: rate(alertmanager_notifications_failed_total{integration="webhook"}[5m]) > 0
        for: 10m
        labels:
          severity: critical
          source: heimdall-meta
        annotations:
          summary: "Alertmanager cannot deliver to the heimdall-bridge webhook"
          description: "Alertmanager's webhook deliveries have been failing for 10m. heimdall-bridge is down, unreachable, or refusing the requests (check its bearer token), so alerts are being detected and NOT reaching any sink or tracker. Check `curl <bridge>/healthz` and journalctl -u heimdall-bridge."

      # heimdall-bridge's own heartbeat: its escalation sweep runs at start
      # and every 15m, and advances this gauge only on a pass with no
      # errors. Three missed passes pages. This proves the process and its
      # sweep are alive; HeimdallBridgeUnreachable above is what proves
      # Alertmanager can actually reach it.
      - alert: HeimdallBridgeSweepStale
        expr: time() - heimdall_bridge_sweep_last_success_timestamp_seconds > 2700
        for: 5m
        labels:
          severity: critical
          source: heimdall-meta
        annotations:
          summary: "Heimdall bridge escalation sweep has not completed cleanly in 45m"
          description: "Either heimdall-bridge is down, or its escalation sweep keeps failing (heimdall_bridge_escalation_errors_total counts the failing issues and the bridge log names them). Long-firing critical groups are not being escalated. 0 means no clean sweep since the bridge started."
      - alert: HeimdallBridgeAbsent
        expr: absent(heimdall_bridge_sweep_last_success_timestamp_seconds)
        labels:
          severity: critical
          source: heimdall-meta
        annotations:
          summary: "Heimdall bridge heartbeat series is absent"
          description: "heimdall-bridge.prom is missing: the bridge is not running, HEIMDALL_TEXTFILE_DIR is not the directory node_exporter serves, or the file was deleted. Absence is never treated as ok."

      # ── Analyst liveness ─────────────────────────────────────────────
      # heimdall-analyst is a oneshot on a timer, and it writes its
      # heartbeat ONLY after a successful run: a dead or unhealthy LLM, an
      # unreadable digest, a model reply outside the schema — every hard
      # failure — withholds it. The threshold assumes the timer fires at
      # least once a day (docs/SETUP.md): two periods plus the 300s run
      # timeout, so one failed run is tolerated and two in a row are not.
      # Run more often and it can be tightened to 2 x period + 300s.
      #
      # Tier 3 is optional. If it is deliberately not deployed, drop these
      # rules rather than silencing them. They warn rather than page for the
      # same reason HeimdallSinkBacklogWarning does: the analyst channel is
      # low-urgency by construction (G1: a hypothesis can never page).
      - alert: HeimdallAnalystStale
        expr: time() - heimdall_analyst_last_success_timestamp_seconds > 2 * 86400 + 300
        labels:
          severity: warning
          source: heimdall-meta
        annotations:
          summary: "Heimdall analyst has not completed a run in 2 days"
          description: "The analyst heartbeat stopped advancing: the LLM health gate is failing, the model call or its reply is failing, or the timer is not firing. Nothing is being analysed. journalctl -u heimdall-analyst names the failure."
      - alert: HeimdallAnalystAbsent
        expr: absent(heimdall_analyst_last_success_timestamp_seconds)
        labels:
          severity: warning
          source: heimdall-meta
        annotations:
          summary: "Heimdall analyst heartbeat series is absent"
          description: "The analyst has never completed a run here, its textfile was deleted, or node_exporter is not serving it. Absence is never treated as ok. Right after deploying, run it once by hand (HEIMDALL_ANALYST_DRY_RUN=true is enough) to create the series."
      - alert: HeimdallAnalystPostFailing
        expr: heimdall_analyst_hypotheses_post_failed_total > 0
        labels:
          severity: warning
          source: heimdall-meta
        annotations:
          summary: "The bridge refused {{ $value }} hypothesis POST(s) in the last analyst run"
          description: "The analyst ran, but the bridge did not accept what it posted (down, or rejecting HEIMDALL_BRIDGE_TOKEN). The hypotheses are persisted in the analyst run directory and stay eligible to post next run; journalctl -u heimdall-analyst has the WARNING lines."
